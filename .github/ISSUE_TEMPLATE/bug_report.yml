name: Bug report
description: Report a reproducible Qingyu issue
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do not include passwords, private messages, personal dictionary entries, or other private typing data.
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: Pixel 8, Android 15
    validations:
      required: true
  - type: input
    id: qingyu
    attributes:
      label: Qingyu version
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Describe steps with sample text that contains no private information.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove personal text and identifiers before sharing.
