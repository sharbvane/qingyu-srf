plugins { id 'com.android.application' }

android {
    namespace 'com.qingyu.ime'
    compileSdk 35
    buildToolsVersion '35.0.0'
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'com.qingyu.ime'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        testInstrumentationRunner 'com.qingyu.ime.ImeSmokeInstrumentation'
        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    buildTypes {
        release { minifyEnabled false; signingConfig signingConfigs.debug }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    sourceSets { main { jniLibs.srcDirs = [] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation project(':core') }

