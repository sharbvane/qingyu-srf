plugins { id 'com.android.application' }

def releaseSigningFile = rootProject.file('release-signing/signing.properties')
def releaseSigning = new Properties()
if (releaseSigningFile.isFile()) {
    releaseSigningFile.withInputStream { releaseSigning.load(it) }
}
def hasReleaseSigning = rootProject.file('release-signing/qingyu-release.p12').isFile() &&
        ['storePassword', 'keyPassword', 'keyAlias'].every { releaseSigning.getProperty(it) }
gradle.taskGraph.whenReady { graph ->
    if (!hasReleaseSigning && graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        throw new GradleException('Release signing is missing. Restore release-signing/ or run scripts/release-signing.ps1 -Action Initialize once.')
    }
}

android {
    namespace 'com.qingyu.ime'
    compileSdk 35
    testBuildType project.findProperty('imeTestBuildType') ?: 'debug'
    buildToolsVersion '35.0.0'
    ndkVersion '28.1.13356709'
    defaultConfig {
        applicationId 'com.qingyu.ime'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '0.6.5'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        testInstrumentationRunner 'com.qingyu.ime.ImeSmokeInstrumentation'
        externalNativeBuild {
            cmake { arguments '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' }
        }
    }
    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file('release-signing/qingyu-release.p12')
                storeType 'PKCS12'
                storePassword releaseSigning.getProperty('storePassword')
                keyAlias releaseSigning.getProperty('keyAlias')
                keyPassword releaseSigning.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.release
        }
    }
    externalNativeBuild {
        cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.22.1' }
    }
    sourceSets { main { jniLibs.srcDirs = [] } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation project(':core')
    implementation 'com.google.mlkit:translate:17.0.3'
}

